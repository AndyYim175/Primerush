//main game
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      PrimeRush
    </title>
    <style>
      :root {
            --bg: #0a0a0a;
            --fg: #ffffff;
            --fg-dim: #888888;
            --accent: #00ff88;
            --accent-dim: #00cc6a;
            --danger: #ff4444;
            --button-bg: #1a1a1a;
            --button-hover: #2a2a2a;
            --button-active: #3a3a3a;
            --card-bg: #111111;
            --tile-size: 80px;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f5f5f5;
                --fg: #0a0a0a;
                --fg-dim: #777777;
                --accent: #00aa55;
                --accent-dim: #008844;
                --danger: #cc3333;
                --button-bg: #ffffff;
                --button-hover: #e5e5e5;
                --button-active: #d5d5d5;
                --card-bg: #eeeeee;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: &#39;Courier New&#39;, monospace;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 0.3s;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            position: relative;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        /* ── Menu ── */
        .menu-screen { text-align: center; }

        .title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            color: var(--accent);
            letter-spacing: 2px;
        }

        .menu-subtitle {
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            color: var(--fg-dim);
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .btn {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 0.9rem 2.5rem;
            font-size: 1.3rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            min-width: 200px;
        }

        .btn:hover { transform: scale(1.05); filter: brightness(1.1); }
        .btn:active { transform: scale(0.95); }

        .btn-secondary {
            background: var(--button-bg);
            color: var(--fg);
            border: 2px solid var(--fg-dim);
        }

        /* ── Settings / Stats ── */
        .settings-screen { text-align: center; }

        .settings-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 2rem;
            color: var(--accent);
        }

        .settings-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1rem;
            text-align: left;
        }

        .settings-section h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--fg-dim);
            margin-bottom: 1rem;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.7rem;
        }

        .setting-row:last-child { margin-bottom: 0; }

        .setting-label { font-size: 1rem; }

        .setting-value {
            font-weight: bold;
            color: var(--accent);
            min-width: 45px;
            text-align: right;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type=&#34;range&#34;] {
            -webkit-appearance: none;
            appearance: none;
            width: 140px;
            height: 6px;
            background: var(--fg-dim);
            border-radius: 3px;
            outline: none;
        }

        input[type=&#34;range&#34;]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        input[type=&#34;range&#34;]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--button-bg);
        }

        .stat-row:last-child { border-bottom: none; }

        .stat-label {
            font-size: 0.95rem;
            color: var(--fg-dim);
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
        }

        .back-btn {
            margin-top: 1.5rem;
        }

        /* ── Game ── */
        .game-screen {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .lives { display: flex; gap: 8px; }

        .heart {
            width: 24px; height: 24px;
            color: var(--danger);
            font-size: 24px;
        }

        .stats {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .score {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        .defeated {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .time-bar-container {
            height: 8px;
            background: var(--button-bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .time-bar {
            height: 100%;
            background: var(--accent);
            transition: width 0.05s linear;
        }

        .number-display {
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            word-break: break-all;
            position: relative;
        }

        .prime-buttons {
            display: grid;
            gap: 10px;
            margin-top: 0.5rem;
            justify-content: center;
        }

        .prime-buttons.phase-1 {
            grid-template-columns: repeat(2, var(--tile-size));
        }

        .prime-buttons.phase-2 {
            grid-template-columns: repeat(3, calc(var(--tile-size) * 0.82));
        }

        .prime-buttons.phase-3 {
            grid-template-columns: repeat(3, calc(var(--tile-size) * 0.68));
        }

        .prime-btn {
            aspect-ratio: 1;
            background: var(--button-bg);
            border: 2px solid var(--fg);
            color: var(--fg);
            font-size: 1.25rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.15s;
            position: relative;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .prime-btn:hover { background: var(--button-hover); transform: scale(1.05); }
        .prime-btn:active { background: var(--button-active); transform: scale(0.95); }

        /* ── Game Over ── */
        .game-over-screen { text-align: center; }

        .game-over-title {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: var(--danger);
        }

        .final-stats { font-size: 1.5rem; margin-bottom: 3rem; }
        .final-stats div { margin: 1rem 0; }

        /* ── Animations ── */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.3s; }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .flash { animation: flash 0.2s; }

        @keyframes defeat {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }
        .defeat { animation: defeat 0.4s; }

        .flying-number {
            position: fixed;
            font-size: 2rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 1;
            color: var(--accent);
        }

        @media (max-width: 600px) {
            .title { font-size: 2rem; }
            .number-display { font-size: 2rem; min-height: 80px; }
            .prime-btn { font-size: 1rem; }
            .btn { padding: 0.8rem 2rem; font-size: 1.2rem; }
        }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Menu -->
      <div class="screen active" id="menuScreen">
        <div class="menu-screen">
          <div class="title">
            Prime 𝑹𝑼𝑺𝑯
          </div>
          <div class="menu-subtitle">
            High Score:
            <span id="menuHighScore">            0
</span>
          </div>
          <div class="menu-buttons">
            <button class="btn" onclick="game.startGame()">
              Start
            </button>
            <button class="btn btn-secondary" onclick="game.showScreen(&#39;settingsScreen&#39;); game.refreshSettings()">
              SETTINGS
            </button>
          </div>
        </div>
      </div>
      <!-- Settings / Stats -->
      <div class="screen" id="settingsScreen">
        <div class="settings-screen">
          <div class="settings-title">
            SETTINGS
          </div>
          <div class="settings-section">
            <h3>
              Tile Size
            </h3>
            <div class="setting-row">
              <div class="slider-row">
                <input type="range" id="tileSizeSlider" min="60" max="150" step="5" value="120" oninput="game.onTileSizeChange(this.value)" />
                <span class="setting-value" id="tileSizeValue">                80
</span>
              </div>
            </div>
          </div>
          <div class="settings-section">
            <h3>
              Persistant stats
            </h3>
            <div class="stat-row">
              <span class="stat-label">              Highest Score
</span>
              <span class="stat-value" id="statHighScore">              0
</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">              Total Defeated
</span>
              <span class="stat-value" id="statTotalDefeated">              0
</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">              Sum of Defeated
</span>
              <span class="stat-value" id="statSumDefeated">              0
</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">              Highest Number
</span>
              <span class="stat-value" id="statHighestNumber">              0
</span>
            </div>
          </div>
          <button class="btn btn-secondary back-btn" onclick="game.showScreen(&#39;menuScreen&#39;)">
            BACK
          </button>
        </div>
      </div>
      <!-- Game -->
      <div class="screen" id="gameScreen">
        <div class="game-screen">
          <div class="game-header">
            <div class="lives" id="livesContainer">
            </div>
            <div class="stats">
              <div class="score" id="scoreDisplay">
                0
              </div>
              <div class="defeated">
                Defeated:
                <span id="defeatedDisplay">                0
</span>
              </div>
            </div>
          </div>
          <div class="time-bar-container">
            <div class="time-bar" id="timeBar">
            </div>
          </div>
          <div class="number-display" id="numberDisplay">
            1
          </div>
          <div class="prime-buttons phase-1" id="primeButtons">
          </div>
        </div>
      </div>
      <!-- Game Over -->
      <div class="screen" id="gameOverScreen">
        <div class="game-over-screen">
          <div class="game-over-title">
            GAME OVER
          </div>
          <div class="final-stats">
            <div>
              Final Score:
              <span id="finalScore">              0
</span>
            </div>
            <div>
              Numbers Defeated:
              <span id="finalDefeated">              0
</span>
            </div>
          </div>
          <button class="btn" onclick="game.returnToMenu()">
            MENU
          </button>
        </div>
      </div>
    </div>
    <script>
      /* ── Storage helper (graceful fallback) ── */
        var _ls = (function () { try { return window[&#39;local&#39; + &#39;Storage&#39;]; } catch (_) { return null; } })();
        const storage = {
            _mem: {},
            get(key, fallback) {
                try {
                    if (!_ls) throw 0;
                    var v = _ls.getItem(key);
                    return v !== null ? JSON.parse(v) : fallback;
                } catch (_) {
                    var m = this._mem[key];
                    return m !== undefined ? m : fallback;
                }
            },
            set(key, value) {
                try {
                    if (!_ls) throw 0;
                    _ls.setItem(key, JSON.stringify(value));
                } catch (_) {
                    this._mem[key] = value;
                }
            }
        };

        const SAVE_KEY = &#39;primeDivide_save&#39;;

        const game = {
            lives: 3,
            score: 0,
            displayedScore: 0,
            defeated: 0,
            currentNumber: 1,
            phase: 1,
            difficulty: 1,
            primes: [],
            maxTime: 0,
            timeRemaining: 0,
            lastTime: 0,
            animationFrame: null,
            scoreTransition: null,

            // Persistent data
            tileSize: 80,
            highScore: 0,
            totalDefeated: 0,
            sumDefeated: 0,
            highestNumber: 0,

            init() {
                this.loadSave();
                this.applyTileSize(this.tileSize);
                this.updateMenuStats();
            },

            loadSave() {
                const data = storage.get(SAVE_KEY, {});
                this.tileSize = data.tileSize || 80;
                this.highScore = data.highScore || 0;
                this.totalDefeated = data.totalDefeated || 0;
                this.sumDefeated = data.sumDefeated || 0;
                this.highestNumber = data.highestNumber || 0;
            },

            persist() {
                storage.set(SAVE_KEY, {
                    tileSize: this.tileSize,
                    highScore: this.highScore,
                    totalDefeated: this.totalDefeated,
                    sumDefeated: this.sumDefeated,
                    highestNumber: this.highestNumber
                });
            },

            applyTileSize(px) {
                document.documentElement.style.setProperty(&#39;--tile-size&#39;, px + &#39;px&#39;);
            },

            onTileSizeChange(val) {
                const v = parseInt(val);
                this.tileSize = v;
                this.applyTileSize(v);
                document.getElementById(&#39;tileSizeValue&#39;).textContent = v;
                this.persist();
            },

            refreshSettings() {
                document.getElementById(&#39;tileSizeSlider&#39;).value = this.tileSize;
                document.getElementById(&#39;tileSizeValue&#39;).textContent = this.tileSize;
                document.getElementById(&#39;statHighScore&#39;).textContent = this.highScore;
                document.getElementById(&#39;statTotalDefeated&#39;).textContent = this.totalDefeated;
                document.getElementById(&#39;statSumDefeated&#39;).textContent = this.sumDefeated;
                document.getElementById(&#39;statHighestNumber&#39;).textContent = this.highestNumber;
            },

            updateMenuStats() {
                document.getElementById(&#39;menuHighScore&#39;).textContent = this.highScore;
            },

            showScreen(screenId) {
                document.querySelectorAll(&#39;.screen&#39;).forEach(function (s) { s.classList.remove(&#39;active&#39;); });
                document.getElementById(screenId).classList.add(&#39;active&#39;);
            },

            startGame() {
                this.lives = 5;
                this.score = 0;
                this.displayedScore = 0;
                this.defeated = 0;
                this.showScreen(&#39;gameScreen&#39;);
                this.updateLives();
                this.updateScore();
                this.nextNumber();
            },

            calculatePhase() {
                var n = this.defeated + 1;
                if (n &lt;= 15) {
                    this.phase = 1;
                    this.difficulty = 1 + 0.02 * n;
                    this.primes = [2, 3, 5, 7];
                    this.maxTime = (8.5 + 0.1 * n) * 1000;
                    return 100 * Math.pow(1.1, n);
                } else if (n &lt;= 30) {
                    this.phase = 2;
                    this.difficulty = 0.7 + 0.04 * n;
                    this.primes = [2, 3, 5, 7, 11, 13];
                    this.maxTime = (7 + 0.2 * n) * 1000;
                    return 50 * Math.pow(1.1, n);
                } else {
                    this.phase = 3;
                    this.difficulty = -1.1 + 0.1 * n;
                    this.primes = [2, 3, 5, 7, 11, 13, 17, 19, 23];
                    this.maxTime = Math.round((13 + 0.5 * Math.sqrt(n - 30)) * 100) / 100 * 1000;
                    return 0.35 * Math.pow(1.25, n);
                }
            },

            generateNumber() {
                var cap = this.calculatePhase();
                var num = 1;
                while (true) {
                    var prime = this.primes[Math.floor(Math.random() * this.primes.length)];
                    if (num * prime &gt; cap) break;
                    num *= prime;
                }
                return num;
            },

            nextNumber() {
                this.currentNumber = this.generateNumber();
                this.timeRemaining = this.maxTime;
                this.updateNumberDisplay();
                this.updateButtons();
                this.lastTime = performance.now();
                this.startTimer();
            },

            updateButtons() {
                var container = document.getElementById(&#39;primeButtons&#39;);
                container.className = &#39;prime-buttons phase-&#39; + this.phase;
                container.innerHTML = &#39;&#39;;
                var self = this;
                this.primes.forEach(function (prime) {
                    var btn = document.createElement(&#39;button&#39;);
                    btn.className = &#39;prime-btn&#39;;
                    btn.textContent = prime;
                    btn.onclick = function () { self.attack(prime, btn); };
                    container.appendChild(btn);
                });
            },

            attack(prime, btn) {
                if (this.currentNumber % prime === 0 &amp;&amp; Number.isInteger(this.currentNumber / prime)) {
                    var timeRatio = this.timeRemaining / this.maxTime;
                    var points = Math.ceil(10 * this.difficulty * Math.pow(timeRatio, 0.55));
                    this.animateNumberFly(prime, btn);
                    var self = this;
                    setTimeout(function () {
                        self.currentNumber /= prime;
                        if (!Number.isInteger(self.currentNumber) || self.currentNumber &lt; 1) {
                            self.loseLife();
                            return;
                        }
                        self.score += points;
                        self.animateScore();
                        self.updateNumberDisplay();
                        if (self.currentNumber === 1) {
                            self.numberDefeated();
                        }
                    }, 500);
                } else {
                    this.loseLife();
                }
            },

            animateNumberFly(prime, btn) {
                var rect = btn.getBoundingClientRect();
                var target = document.getElementById(&#39;numberDisplay&#39;).getBoundingClientRect();
                var flyingNum = document.createElement(&#39;div&#39;);
                flyingNum.className = &#39;flying-number&#39;;
                flyingNum.textContent = prime;
                flyingNum.style.left = rect.left + rect.width / 2 + &#39;px&#39;;
                flyingNum.style.top = rect.top + rect.height / 2 + &#39;px&#39;;
                document.body.appendChild(flyingNum);
                var startX = rect.left + rect.width / 2;
                var startY = rect.top + rect.height / 2;
                var endX = target.left + target.width / 2;
                var endY = target.top + target.height / 2;
                var startTime = performance.now();
                var duration = 500;
                var animate = function (currentTime) {
                    var elapsed = currentTime - startTime;
                    var progress = Math.min(elapsed / duration, 1);
                    var eased = 1 - Math.pow(1 - progress, 2);
                    var x = startX + (endX - startX) * eased;
                    var y = startY + (endY - startY) * eased;
                    flyingNum.style.left = x + &#39;px&#39;;
                    flyingNum.style.top = y + &#39;px&#39;;
                    flyingNum.style.opacity = 1 - progress;
                    if (progress &lt; 1) {
                        requestAnimationFrame(animate);
                    } else {
                        flyingNum.remove();
                    }
                };
                requestAnimationFrame(animate);
            },

            animateScore() {
                if (this.scoreTransition) {
                    this.scoreTransition.cancelled = true;
                }
                var startScore = this.displayedScore;
                var endScore = this.score;
                var startTime = performance.now();
                var duration = 1000;
                var transition = { cancelled: false };
                this.scoreTransition = transition;
                var self = this;
                var animate = function (currentTime) {
                    if (transition.cancelled) return;
                    var elapsed = currentTime - startTime;
                    var progress = Math.min(elapsed / duration, 1);
                    var eased = 1 - Math.pow(1 - progress, 3);
                    self.displayedScore = Math.round(startScore + (endScore - startScore) * eased);
                    self.updateScore();
                    if (progress &lt; 1) {
                        requestAnimationFrame(animate);
                    }
                };
                requestAnimationFrame(animate);
            },

            numberDefeated() {
                // Track the original number before it was divided to 1
                var originalNum = this.currentNumber; // already 1 here
                // We need to track at generation time instead — see nextNumber
                this.defeated++;
                this.totalDefeated++;
                this.sumDefeated += this._lastGeneratedNumber || 0;
                if ((this._lastGeneratedNumber || 0) &gt; this.highestNumber) {
                    this.highestNumber = this._lastGeneratedNumber;
                }
                document.getElementById(&#39;defeatedDisplay&#39;).textContent = this.defeated;

                var display = document.getElementById(&#39;numberDisplay&#39;);
                display.classList.add(&#39;defeat&#39;);

                if (this.animationFrame) {
                    cancelAnimationFrame(this.animationFrame);
                }

                var self = this;
                setTimeout(function () {
                    display.classList.remove(&#39;defeat&#39;);
                    self.nextNumber();
                }, 400);
            },

            loseLife() {
                this.lives--;
                this.updateLives();
                var container = document.querySelector(&#39;.container&#39;);
                container.classList.add(&#39;shake&#39;, &#39;flash&#39;);
                setTimeout(function () {
                    container.classList.remove(&#39;shake&#39;, &#39;flash&#39;);
                }, 300);

                if (this.lives &lt;= 0) {
                    this.gameOver();
                } else {
                    if (this.animationFrame) {
                        cancelAnimationFrame(this.animationFrame);
                    }
                    var self = this;
                    setTimeout(function () {
                        self.nextNumber();
                    }, 400);
                }
            },

            updateLives() {
                var container = document.getElementById(&#39;livesContainer&#39;);
                container.innerHTML = &#39;&#39;;
                for (var i = 0; i &lt; this.lives; i++) {
                    var heart = document.createElement(&#39;div&#39;);
                    heart.className = &#39;heart&#39;;
                    heart.textContent = &#39;\u2665&#39;;
                    container.appendChild(heart);
                }
            },

            updateScore() {
                document.getElementById(&#39;scoreDisplay&#39;).textContent = this.displayedScore;
            },

            updateNumberDisplay() {
                document.getElementById(&#39;numberDisplay&#39;).textContent = this.currentNumber;
            },

            startTimer() {
                var self = this;
                var update = function (currentTime) {
                    var delta = currentTime - self.lastTime;
                    self.lastTime = currentTime;
                    self.timeRemaining -= delta;
                    if (self.timeRemaining &lt;= 0) {
                        self.timeRemaining = 0;
                        self.updateTimeBar();
                        self.loseLife();
                        return;
                    }
                    self.updateTimeBar();
                    self.animationFrame = requestAnimationFrame(update);
                };
                this.animationFrame = requestAnimationFrame(update);
            },

            updateTimeBar() {
                var percent = (this.timeRemaining / this.maxTime) * 100;
                document.getElementById(&#39;timeBar&#39;).style.width = percent + &#39;%&#39;;
            },

            gameOver() {
                if (this.animationFrame) {
                    cancelAnimationFrame(this.animationFrame);
                }
                if (this.score &gt; this.highScore) {
                    this.highScore = this.score;
                }
                this.persist();
                this.updateMenuStats();

                document.getElementById(&#39;finalScore&#39;).textContent = this.score;
                document.getElementById(&#39;finalDefeated&#39;).textContent = this.defeated;
                this.showScreen(&#39;gameOverScreen&#39;);
            },

            returnToMenu() {
                this.showScreen(&#39;menuScreen&#39;);
            }
        };

        // Patch nextNumber to track generated number
        var _origNext = game.nextNumber.bind(game);
        game.nextNumber = function () {
            _origNext();
            game._lastGeneratedNumber = game.currentNumber;
        };

        // Dark mode
        if (window.matchMedia &amp;&amp; window.matchMedia(&#39;(prefers-color-scheme: dark)&#39;).matches) {
            document.documentElement.classList.add(&#39;dark&#39;);
        }
        window.matchMedia(&#39;(prefers-color-scheme: dark)&#39;).addEventListener(&#39;change&#39;, function (event) {
            if (event.matches) {
                document.documentElement.classList.add(&#39;dark&#39;);
            } else {
                document.documentElement.classList.remove(&#39;dark&#39;);
            }
        });

        game.init();
    </script>
  </body>
</html>
